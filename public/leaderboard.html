<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<title>SkillForge Leaderboard</title>

<link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Inter,sans-serif;
}

body{
background:linear-gradient(135deg,#c6c4ff,#98c5ff);
height:100vh;
display:flex;
align-items:center;
justify-content:center;
}

.container{
width:95%;
height:92vh;
background:#f6f7fb;
border-radius:28px;
display:flex;
overflow:hidden;
}

/* SIDEBAR */

.sidebar{
width:80px;
background:#fff;
display:flex;
flex-direction:column;
align-items:center;
padding-top:20px;
gap:30px;
}

.sidebar button{
width:45px;
height:45px;
border:none;
border-radius:12px;
background:#f0f2f8;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
}

.sidebar button i{
font-size:20px;
color:#444;
}

.sidebar button.active{
background:#111;
}

.sidebar button.active i{
color:#fff;
}

/* CONTENT */

.content{
flex:1;
padding:40px;
overflow:auto;
}

.leaderboard-card{
background:white;
padding:30px;
border-radius:20px;
box-shadow:0 8px 20px rgba(0,0,0,0.05);
max-width:700px;
}

/* USER ROW */

.user{
display:flex;
align-items:center;
justify-content:space-between;
padding:15px;
border-radius:12px;
margin-bottom:10px;
background:#f3f4ff;
}

.user-left{
display:flex;
align-items:center;
gap:12px;
}

.user img{
width:40px;
height:40px;
border-radius:50%;
object-fit:cover;
border:2px solid #e5e7ff;
}

.rank{
font-weight:bold;
font-size:18px;
width:30px;
}

.score{
font-weight:bold;
color:#6c7cff;
}

.empty{
text-align:center;
color:#888;
margin-top:30px;
}

.rank{
font-size:22px;
width:35px;
font-weight:bold;
display:flex;
align-items:center;
justify-content:center;
}

.user:nth-child(1){
background:linear-gradient(135deg,#fff3b0,#ffe066);
border:2px solid #ffd700;
font-weight:600;
}

.user:nth-child(2){
background:linear-gradient(135deg,#e8e8e8,#d9d9d9);
border:2px solid #c0c0c0;
font-weight:600;
}

.user:nth-child(3){
background:linear-gradient(135deg,#f6d3b3,#e6b089);
border:2px solid #cd7f32;
font-weight:600;
}
</style>

</head>

<body>

<div class="container">

<!-- SIDEBAR -->

<div class="sidebar">

<button onclick="location.href='dashboard.html'">
<i class="ri-home-4-line"></i>
</button>

<button onclick="location.href='courses.html'">
<i class="ri-book-open-line"></i>
</button>

<button onclick="location.href='adaptive-test.html'">
<i class="ri-brain-line"></i>
</button>

<button onclick="location.href='performance.html'">
<i class="ri-bar-chart-line"></i>
</button>

<button onclick="location.href='files.html'">
<i class="ri-file-text-line"></i>
</button>

<button onclick="location.href='certificates.html'">
<i class="ri-award-line"></i>
</button>

<button onclick="location.href='messages.html'">
<i class="ri-robot-line"></i>
</button>

<button onclick="location.href='notifications.html'">
<i class="ri-notification-3-line"></i>
</button>

<button onclick="location.href='settings.html'">
<i class="ri-settings-3-line"></i>
</button>

<button class="active">
<i class="ri-trophy-line"></i>
</button>

</div>

<!-- CONTENT -->

<div class="content">

<h1 style="margin-bottom:25px;">Leaderboard</h1>

<div class="leaderboard-card">

<h3 style="margin-bottom:20px;">Top Students</h3>

<div id="leaderboardList"></div>

<div id="emptyMessage" class="empty" style="display:none;">
No leaderboard data available yet.
</div>

</div>

</div>

</div>

<script>

const API = "http://localhost:5000";

async function loadLeaderboard(){

try{

const res = await fetch(API + "/api/leaderboard");

const users = await res.json();

const container = document.getElementById("leaderboardList");
const empty = document.getElementById("emptyMessage");

container.innerHTML = "";

if(!users || users.length === 0){

empty.style.display = "block";
return;

}

empty.style.display = "none";

users.forEach((user,index)=>{

let medal = index + 1;

if(index === 0) medal = "🥇";
else if(index === 1) medal = "🥈";
else if(index === 2) medal = "🥉";

container.innerHTML += `

<div class="user">

<div class="user-left">

<div class="rank">${medal}</div>

<img src="https://ui-avatars.com/api/?name=${encodeURIComponent(user.name)}&background=6c7cff&color=ffffff&size=128" alt="profile">

<span>${user.name}</span>

</div>

<div class="score">${user.total_score}</div>

</div>

`;

});

}catch(err){

console.log("Leaderboard error:",err);

document.getElementById("emptyMessage").style.display = "block";

}

}

loadLeaderboard();

</script>

</body>
</html>
