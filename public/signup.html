<!DOCTYPE html>

<html lang="en">
<head>

<meta charset="UTF-8">
<title>Sign Up - SkillForge</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Inter,sans-serif;
}

body{
background:linear-gradient(135deg,#c6c4ff,#98c5ff);
height:100vh;
display:flex;
align-items:center;
justify-content:center;
}

/* Loading */

.loading-screen{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#0f172a;
display:flex;
align-items:center;
justify-content:center;
z-index:9999;
color:white;
font-size:20px;
font-weight:600;
display:none;
}

.spinner{
width:35px;
height:35px;
border:4px solid #334155;
border-top:4px solid #60a5fa;
border-radius:50%;
animation:spin 1s linear infinite;
margin-right:10px;
}

@keyframes spin{
0%{transform:rotate(0deg);}
100%{transform:rotate(360deg);}
}

/* Card */

.auth-wrapper{
width:100%;
display:flex;
justify-content:center;
align-items:center;
}

.auth-card{

background:#fff;
width:420px;
padding:40px;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,0.08);
text-align:center;

}

.auth-card h2{
font-size:28px;
margin-bottom:5px;
}

.auth-sub{
color:#666;
margin-bottom:25px;
}

/* Inputs */

.auth-form{
display:flex;
flex-direction:column;
gap:15px;
}

.auth-form input{

padding:12px;
border-radius:10px;
border:1px solid #ddd;
outline:none;
font-size:14px;

}

.auth-form input:focus{
border-color:#6c7cff;
}

/* Buttons */

.primary-btn{

background:#111;
color:white;
border:none;
padding:12px;
border-radius:10px;
cursor:pointer;
font-weight:500;

}

.primary-btn:hover{
opacity:0.9;
}

.full-btn{
width:100%;
}

/* Link */

.auth-link{
margin-top:18px;
font-size:14px;
color:#555;
}

.auth-link a{
color:#6c7cff;
text-decoration:none;
font-weight:500;
}

</style>

</head>

<body>

<div class="loading-screen" id="loadingScreen">
<div class="spinner"></div>
Processing...
</div>

<div class="auth-wrapper">

<div class="auth-card">

<h2>Create Account</h2>
<p class="auth-sub">Start your AI learning journey</p>

<form class="auth-form">

<input type="text" id="name" placeholder="Full Name" required>

<input type="email" id="email" placeholder="Email Address" required>

<input type="password" id="password" placeholder="Password (min 6 chars)" required>

<input type="password" id="confirmPassword" placeholder="Confirm Password" required>

<div id="otpSection" style="display:none">

<input type="text" id="otpInput" placeholder="Enter OTP">

<button type="button" class="primary-btn full-btn" onclick="verifyOTP()" id="verifyBtn">
Verify OTP
</button>

</div>

<button type="button" id="sendOtpBtn" class="primary-btn full-btn" onclick="sendOTP()">
Send OTP
</button>

<button type="submit" id="registerBtn" class="primary-btn full-btn" style="display:none">
Register
</button>

</form>

<p class="auth-link">
Already have an account?
<a href="login.html">Login</a>
</p>

</div>

</div>

<script>

/* ================= THEME LOAD ================= */

const theme = localStorage.getItem("theme");

if(theme === "dark"){
document.body.classList.add("dark");
}

/* ================= LOADING ================= */

const loading = document.getElementById("loadingScreen");

/* ================= OTP SEND ================= */

async function sendOTP(){

const email = document.getElementById("email").value;

if(!email){
alert("Please enter email first");
return;
}

loading.style.display="flex";

try{

const res = await fetch("http://localhost:5000/api/send-otp",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({email})

});

const data = await res.json();

loading.style.display="none";

if(res.ok){

alert("OTP sent to your email");

document.getElementById("otpSection").style.display="block";

}else{

alert(data.message || "Failed to send OTP");

}

}catch(err){

loading.style.display="none";
alert("Server error");

}

}

/* ================= OTP VERIFY ================= */

async function verifyOTP(){

const email = document.getElementById("email").value;
const otp = document.getElementById("otpInput").value;

loading.style.display="flex";

try{

const res = await fetch("http://localhost:5000/api/verify-otp",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({email,otp})

});

const data = await res.json();

loading.style.display="none";

if(res.ok && data.verified){

alert("OTP Verified");

document.getElementById("sendOtpBtn").style.display="none";
document.getElementById("otpSection").style.display="none";

document.getElementById("registerBtn").style.display="block";

}else{

alert("Invalid OTP");

}

}catch(err){

loading.style.display="none";
alert("Server error");

}

}

/* ================= REGISTER ================= */

const form = document.querySelector(".auth-form");

form.addEventListener("submit", async (e)=>{

e.preventDefault();

const name = document.getElementById("name").value;
const email = document.getElementById("email").value;
const password = document.getElementById("password").value;
const confirmPassword = document.getElementById("confirmPassword").value;

if(password.length < 6){

alert("Password must be at least 6 characters");
return;

}

if(password !== confirmPassword){

alert("Passwords do not match");
return;

}

loading.style.display="flex";

try{

const res = await fetch("http://localhost:5000/api/register",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({name,email,password})

});

const data = await res.json();

loading.style.display="none";

if(res.ok){

alert("Registration successful!");
window.location.href="login.html";

}else{

alert(data.message || "Registration failed");

}

}catch(err){

loading.style.display="none";
alert("Server error");

}

});

</script>

</body>
</html>
