<!DOCTYPE html>
<html>
<head>

<title>Quiz Manager</title>

<link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">

<style>

body{
font-family:Inter;
background:linear-gradient(135deg,#c6c4ff,#98c5ff);
height:100vh;
display:flex;
align-items:center;
justify-content:center;
}

.container{
width:95%;
height:92vh;
background:#f6f7fb;
border-radius:28px;
display:flex;
overflow:hidden;
}

/* SIDEBAR */

.sidebar{
width:80px;
background:#fff;
display:flex;
flex-direction:column;
align-items:center;
padding-top:20px;
gap:30px;
}

.sidebar button{
width:45px;
height:45px;
border:none;
border-radius:12px;
background:#f0f2f8;
cursor:pointer;
display:flex;
align-items:center;
justify-content:center;
}

.sidebar button i{
font-size:20px;
color:#444;
}

.sidebar button.active{
background:#111;
}

.sidebar button.active i{
color:white;
}

/* CONTENT */

.content{
flex:1;
padding:40px;
}

.card{
background:white;
padding:40px;
border-radius:18px;
max-width:600px;
}

.quiz-option{
width:100%;
padding:20px;
margin-top:15px;
border:none;
border-radius:12px;
background:#6c7cff;
color:white;
font-size:18px;
cursor:pointer;
}

</style>

</head>

<body>

<div class="container">

<div class="sidebar">

<button onclick="location.href='admin-dashboard.html'">
<i class="ri-dashboard-line"></i>
</button>

<button onclick="location.href='admin-courses.html'">
<i class="ri-book-open-line"></i>
</button>

<button onclick="location.href='admin-course-library.html'">
<i class="ri-book-2-line"></i>
</button>

<button class="active">
<i class="ri-question-line"></i>
</button>

<button onclick="location.href='admin-feedback.html'">
<i class="ri-chat-3-line"></i>
</button>

<button onclick="location.href='admin-users.html'">
<i class="ri-group-line"></i>
</button>

</div>

<div class="content">

<h1>Quiz Manager</h1>

<div class="card">

<h3>Select Quiz Type</h3>

<button class="quiz-option"
onclick="location.href='admin-adaptive-quiz.html'">
Adaptive Quiz
</button>

<button class="quiz-option"
onclick="location.href='admin-final-quiz.html'">
Final Quiz
</button>

</div>

</div>

</div>

</body>
</html>
