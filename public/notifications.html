<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SkillForge Notifications</title>

<link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Inter,sans-serif;
}

body{
background:linear-gradient(135deg,#c6c4ff,#98c5ff);
height:100vh;
display:flex;
align-items:center;
justify-content:center;
}

.container{
width:95%;
height:92vh;
background:#f6f7fb;
border-radius:28px;
display:flex;
overflow:hidden;
}

/* SIDEBAR */

.sidebar{
width:80px;
background:#fff;
display:flex;
flex-direction:column;
align-items:center;
padding-top:20px;
gap:30px;
}

.sidebar button{
width:45px;
height:45px;
border:none;
border-radius:12px;
background:#f0f2f8;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
}

.sidebar button i{
font-size:20px;
color:#444;
}

.sidebar button.active{
background:#111;
}

.sidebar button.active i{
color:#fff;
}

/* CONTENT */

.content{
flex:1;
padding:40px;
overflow:auto;
}

.notifications-card{
background:white;
padding:30px;
border-radius:20px;
box-shadow:0 8px 20px rgba(0,0,0,0.05);
max-width:700px;
}

/* NOTIFICATION ITEM */

.notification{
display:flex;
align-items:center;
gap:15px;
padding:14px;
border-radius:12px;
margin-bottom:12px;
background:#f3f4ff;
}

.notification i{
font-size:22px;
color:#6c7cff;
}

.notification-text{
flex:1;
}

.time{
font-size:12px;
color:#777;
}

</style>
</head>

<body>

<div class="container">

<!-- SIDEBAR -->

<div class="sidebar">

<button onclick="location.href='dashboard.html'">
<i class="ri-home-4-line"></i>
</button>

<button onclick="location.href='courses.html'">
<i class="ri-book-open-line"></i>
</button>

<button onclick="location.href='adaptive-test.html'">
<i class="ri-brain-line"></i>
</button>

<button onclick="location.href='performance.html'">
<i class="ri-bar-chart-line"></i>
</button>

<button onclick="location.href='files.html'">
<i class="ri-file-text-line"></i>
</button>

<button onclick="location.href='certificates.html'">
<i class="ri-award-line"></i>
</button>

<button onclick="location.href='messages.html'">
<i class="ri-message-2-line"></i>
</button>

<button onclick="location.href='settings.html'">
<i class="ri-settings-3-line"></i>
</button>

<button class="active">
<i class="ri-notification-3-line"></i>
</button>

</div>

<!-- MAIN CONTENT -->

<div class="content">

<h1 style="margin-bottom:25px;">Notifications</h1>

<div class="notifications-card" id="notificationsList">

<!-- Notifications will load here -->

</div>

</div>

</div>

<script>

const API = "http://localhost:5000";

const token = localStorage.getItem("token");

async function loadNotifications(){

try{

const res = await fetch(API + "/api/notifications",{
headers:{
"Authorization":"Bearer " + token
}
});

const notifications = await res.json();
// Mark all notifications as read
await fetch(API + "/api/notifications/mark-read",{
method:"POST",
headers:{
"Authorization":"Bearer "+token
}
});
const container = document.getElementById("notificationsList");

container.innerHTML = "";

if(!notifications || notifications.length === 0){

container.innerHTML = "<p>No notifications yet</p>";
return;

}

notifications.forEach(n=>{

const date = new Date(n.date);

const time = date.toLocaleString();

container.innerHTML += `
<div class="notification">
<i class="ri-notification-3-line"></i>
<div class="notification-text">
${n.message}
</div>
<div class="time">${time}</div>
</div>
`;

});

}catch(err){

console.log("Notification error",err);

}

}

loadNotifications();

</script>

</body>
</html>
