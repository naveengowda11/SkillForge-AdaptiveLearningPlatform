<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SkillForge Profile</title>

<link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Inter,sans-serif;
}

body{
background:linear-gradient(135deg,#c6c4ff,#98c5ff);
height:100vh;
display:flex;
align-items:center;
justify-content:center;
}

.container{
width:95%;
height:92vh;
background:#f6f7fb;
border-radius:28px;
display:flex;
overflow:hidden;
}

/* SIDEBAR */

.sidebar{
width:80px;
background:#fff;
display:flex;
flex-direction:column;
align-items:center;
padding-top:20px;
gap:30px;
}

.sidebar button{
width:45px;
height:45px;
border:none;
border-radius:12px;
background:#f0f2f8;
cursor:pointer;
}

/* CONTENT */

.content{
flex:1;
padding:30px;
overflow:auto;
}

/* HEADER */

.profile-header{
display:flex;
align-items:center;
gap:20px;
background:white;
padding:25px;
border-radius:16px;
margin-bottom:20px;
}

.profile-header img{
width:90px;
height:90px;
border-radius:50%;
object-fit:cover;
}

.profile-info h2{
margin-bottom:4px;
}

/* STATS */

.stats{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:15px;
margin-bottom:20px;
}

.stat-card{
background:white;
padding:18px;
border-radius:14px;
text-align:center;
}

/* SECTIONS */

.section{
background:white;
padding:25px;
border-radius:16px;
margin-bottom:20px;
}

.section h3{
margin-bottom:12px;
}

/* PROGRESS BAR */

.progress{
background:#eee;
height:10px;
border-radius:6px;
margin-top:6px;
}

.progress-fill{
height:10px;
background:#6c7cff;
border-radius:6px;
}

/* BUTTON */

button.edit{
background:#6c7cff;
color:white;
border:none;
padding:10px 18px;
border-radius:8px;
cursor:pointer;
}

</style>
</head>

<body>

<div class="container">

<!-- SIDEBAR -->

<div class="sidebar">

<button onclick="location.href='dashboard.html'">
<i class="ri-home-4-line"></i>
</button>

<button onclick="location.href='courses.html'">
<i class="ri-book-open-line"></i>
</button>

<button onclick="location.href='adaptive-test.html'">
<i class="ri-brain-line"></i>
</button>

<button onclick="location.href='performance.html'">
<i class="ri-bar-chart-line"></i>
</button>

</div>

<!-- CONTENT -->

<div class="content">

<!-- PROFILE HEADER -->

<div class="profile-header">

<img id="profilePhoto" src="assets/profile.jpg">

<div class="profile-info">
<h2 id="profileName">Loading...</h2>
<p id="profileEmail"></p>

<button class="edit" onclick="location.href='edit-profile.html'">
Edit Profile
</button>
</div>

</div>

<!-- STATS -->

<div class="stats">

<div class="stat-card">
<h3 id="coursesEnrolled">0</h3>
<p>Courses</p>
</div>

<div class="stat-card">
<h3 id="coursesCompleted">0</h3>
<p>Completed</p>
</div>

<div class="stat-card">
<h3 id="certificatesEarned">0</h3>
<p>Certificates</p>
</div>

<div class="stat-card">
<h3 id="leaderboardRank">-</h3>
<p>Leaderboard Rank</p>
</div>

</div>

<!-- ABOUT -->

<div class="section">

<h3>About</h3>

<p id="bioText">Loading...</p>

</div>

<!-- EDUCATION -->

<div class="section">

<h3>Education</h3>

<p id="educationText"></p>

<h3>Skills</h3>

<p id="skillsText"></p>

</div>

<!-- COURSE PROGRESS -->

<div class="section">

<h3>Course Progress</h3>

<div id="courseProgress"></div>

</div>

<!-- CERTIFICATES -->

<div class="section">

<h3>Certificates</h3>

<div id="certificateList"></div>

</div>

</div>

</div>

<script>

const token = localStorage.getItem("token");
const userId = localStorage.getItem("userId");

/* LOAD PROFILE */

async function loadProfile(){

const res = await fetch(
"http://localhost:5000/api/profile",
{
headers:{Authorization:"Bearer "+token}
});

const data = await res.json();

profileName.innerText = data.name || localStorage.getItem("name");
profileEmail.innerText = data.email || "";

bioText.innerText = data.bio || "No bio added yet.";
educationText.innerText = data.education || "-";
skillsText.innerText = data.skills || "-";

if(data.photo){
profilePhoto.src =
"http://localhost:5000/"+data.photo.replace(/\\/g,"/");
}

}

/* LOAD STATS */

async function loadStats(){

const res = await fetch(
`http://localhost:5000/api/profile-stats/${userId}`
);

const data = await res.json();

coursesEnrolled.innerText = data.enrolled || 0;
coursesCompleted.innerText = data.completed || 0;
certificatesEarned.innerText = data.certificates || 0;
leaderboardRank.innerText = data.rank || "-";

}

/* LOAD COURSE PROGRESS */

async function loadProgress(){

const res = await fetch(
"http://localhost:5000/api/admin/courses"
);

const courses = await res.json();

const container = document.getElementById("courseProgress");

container.innerHTML="";

for(const c of courses){

const progressRes = await fetch(
`http://localhost:5000/api/course-progress/${c.title}`,
{
headers:{Authorization:"Bearer "+token}
});

const progress = await progressRes.json();

if(!progress) continue;

const percent =
Math.floor((progress.module_completed/progress.total_modules)*100);

container.innerHTML+=`

<div style="margin-bottom:12px">

<b>${c.title}</b>

<div class="progress">
<div class="progress-fill" style="width:${percent}%"></div>
</div>

<span>${percent}% complete</span>

</div>

`;

}

}

/* LOAD CERTIFICATES */

async function loadCertificates(){

const res = await fetch(
`http://localhost:5000/api/certificates/${userId}`
);

const certs = await res.json();

const container = document.getElementById("certificateList");

container.innerHTML="";

if(!certs || certs.length===0){

container.innerHTML="<p>No certificates yet</p>";
return;

}

certs.forEach(c=>{

container.innerHTML+=`

<div style="margin-bottom:10px">

<b>${c.course}</b><br>
Completed on ${new Date(c.date).toLocaleDateString()}

</div>

`;

});

}

/* INIT */

async function init(){

await loadProfile();

await loadStats();

await loadProgress();

await loadCertificates();

}

init();

</script>

</body>
</html>
