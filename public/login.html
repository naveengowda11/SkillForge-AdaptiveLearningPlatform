<!DOCTYPE html>

<html lang="en">
<head>

<meta charset="UTF-8">
<title>Login - SkillForge</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Inter,sans-serif;
}

body{
background:linear-gradient(135deg,#c6c4ff,#98c5ff);
height:100vh;
display:flex;
align-items:center;
justify-content:center;
}

/* Loading Screen */

.loading-screen{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:#0f172a;
display:flex;
align-items:center;
justify-content:center;
z-index:9999;
color:white;
font-size:20px;
font-weight:600;
display:none;
}

.spinner{
width:35px;
height:35px;
border:4px solid #334155;
border-top:4px solid #60a5fa;
border-radius:50%;
animation:spin 1s linear infinite;
margin-right:10px;
}

@keyframes spin{
0%{transform:rotate(0deg);}
100%{transform:rotate(360deg);}
}

/* Auth Layout */

.auth-wrapper{
width:100%;
display:flex;
justify-content:center;
align-items:center;
}

.auth-card{

background:#fff;
width:420px;
padding:40px;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,0.08);
text-align:center;

}

.auth-card h2{
font-size:28px;
margin-bottom:5px;
}

.auth-sub{
color:#666;
margin-bottom:25px;
}

/* Inputs */

.auth-form{
display:flex;
flex-direction:column;
gap:15px;
}

.auth-form input{

padding:12px;
border-radius:10px;
border:1px solid #ddd;
outline:none;
font-size:14px;

}

.auth-form input:focus{
border-color:#6c7cff;
}

/* Buttons */

.primary-btn{

background:#111;
color:white;
border:none;
padding:12px;
border-radius:10px;
cursor:pointer;
font-weight:500;

}

.primary-btn:hover{
opacity:0.9;
}

.full-btn{
width:100%;
}

/* Divider */

.auth-divider{
margin:20px 0;
position:relative;
text-align:center;
color:#888;
font-size:14px;
}

.auth-divider::before,
.auth-divider::after{
content:"";
position:absolute;
top:50%;
width:40%;
height:1px;
background:#ddd;
}

.auth-divider::before{
left:0;
}

.auth-divider::after{
right:0;
}

/* Google Button */

.google-btn{

width:100%;
padding:12px;
border-radius:10px;
border:1px solid #ddd;
background:#fff;
cursor:pointer;
font-weight:500;

}

/* Links */

.auth-link{
margin-top:18px;
font-size:14px;
color:#555;
}

.auth-link a{
color:#6c7cff;
text-decoration:none;
font-weight:500;
}

.forgot{
margin-top:10px;
font-size:14px;
}

.forgot a{
color:#6c7cff;
text-decoration:none;
}

</style>

</head>

<body>

<div class="loading-screen" id="loadingScreen">
<div class="spinner"></div>
Logging in...
</div>

<div class="auth-wrapper">

<div class="auth-card">

<h2>Welcome Back</h2>
<p class="auth-sub">Continue your AI learning journey</p>

<form class="auth-form">

<input type="email" placeholder="Email Address" required>

<input type="password" placeholder="Password" required>

<button type="submit" class="primary-btn full-btn" id="loginBtn">
Login
</button>

</form>

<div class="auth-divider">
<span>OR</span>
</div>

<button class="google-btn"
onclick="window.location.href='http://localhost:5000/auth/google'">
Continue with Google </button>

<p class="auth-link">
Don’t have an account?
<a href="signup.html">Create Account</a>
</p>

<p class="forgot">
<a href="forgot-password.html">Forgot Password?</a>
</p>

</div>

</div>

<script>

/* ================= THEME LOAD ================= */

const theme = localStorage.getItem("theme");

if(theme === "dark"){
document.body.classList.add("dark");
}

/* ================= LOGIN ================= */

const form = document.querySelector(".auth-form");
const loading = document.getElementById("loadingScreen");

form.addEventListener("submit", async function(e){

e.preventDefault();

const email = form.querySelector("input[type='email']").value;
const password = form.querySelector("input[type='password']").value;

loading.style.display="flex";

try{

const res = await fetch("http://localhost:5000/api/login",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({email,password})
});

const data = await res.json();

loading.style.display="none";

if(!res.ok){
alert(data.message || "Login failed");
return;
}

localStorage.setItem("token",data.token);
localStorage.setItem("name",data.name);
localStorage.setItem("userId",data.userId);

if(data.role === "admin"){
window.location.href="admin-dashboard.html";
}else{
window.location.href="dashboard.html";
}

}catch(err){

loading.style.display="none";
alert("Server error");

}

});

</script>

</body>
</html>
