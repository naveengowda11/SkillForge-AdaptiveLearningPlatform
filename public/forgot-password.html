<!DOCTYPE html>

<html lang="en">
<head>

<meta charset="UTF-8">
<title>Reset Password - SkillForge</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Inter,sans-serif;
}

body{
background:linear-gradient(135deg,#c6c4ff,#98c5ff);
height:100vh;
display:flex;
align-items:center;
justify-content:center;
}

/* Layout */

.auth-wrapper{
width:100%;
display:flex;
align-items:center;
justify-content:center;
}

/* Card */

.auth-card{

background:#fff;
width:420px;
padding:40px;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,0.08);
text-align:center;

}

.auth-card h2{
font-size:28px;
margin-bottom:10px;
}

.auth-sub{
color:#666;
margin-bottom:25px;
}

/* Inputs */

.auth-input{

width:100%;
padding:12px;
border-radius:10px;
border:1px solid #ddd;
outline:none;
font-size:14px;
margin-bottom:12px;

}

.auth-input:focus{
border-color:#6c7cff;
}

/* Button */

.primary-btn{

background:#111;
color:white;
border:none;
padding:12px;
border-radius:10px;
cursor:pointer;
font-weight:500;

}

.primary-btn:hover{
opacity:0.9;
}

.full-btn{
width:100%;
}

/* OTP Section */

#otpSection{
margin-top:15px;
}

</style>

</head>

<body>

<div class="auth-wrapper">

<div class="auth-card">

<h2>Reset Password</h2>
<p class="auth-sub">Enter your registered email to receive OTP</p>

<input
type="email"
id="email"
class="auth-input"
placeholder="Registered Email"
required

>

<button
class="primary-btn full-btn"
onclick="sendResetOTP()">
Send OTP </button>

<div id="otpSection" style="display:none;">

<input
type="text"
id="otp"
class="auth-input"
placeholder="Enter OTP"

>

<input
type="password"
id="newPassword"
class="auth-input"
placeholder="New Password"

>

<input
type="password"
id="confirmPassword"
class="auth-input"
placeholder="Confirm Password"

>

<button
class="primary-btn full-btn"
onclick="resetPassword()">
Reset Password </button>

</div>

</div>

</div>

<script>

async function sendResetOTP(){

const email = document.getElementById("email").value;

const res = await fetch("http://localhost:5000/api/forgot-password/send-otp",{
method:"POST",
headers:{ "Content-Type":"application/json" },
body:JSON.stringify({email})
});

const data = await res.json();

if(res.ok){

alert("OTP Sent");
document.getElementById("otpSection").style.display="block";

}else{

alert(data.message);

}

}

async function resetPassword(){

const email = document.getElementById("email").value;
const otp = document.getElementById("otp").value;
const newPassword = document.getElementById("newPassword").value;
const confirmPassword = document.getElementById("confirmPassword").value;

if(newPassword !== confirmPassword){
alert("Passwords do not match");
return;
}

const res = await fetch("http://localhost:5000/api/forgot-password/reset",{
method:"POST",
headers:{ "Content-Type":"application/json" },
body:JSON.stringify({ email, otp, newPassword })
});

const data = await res.json();

if(res.ok){

localStorage.setItem("token",data.token);
localStorage.setItem("name",data.name);
localStorage.setItem("email",data.email);

window.location.href="dashboard.html";

}else{

alert(data.message);

}

}

</script>

</body>
</html>
