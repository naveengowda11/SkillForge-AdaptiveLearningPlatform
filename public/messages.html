<!DOCTYPE html>

<html lang="en">
<head>

<meta charset="UTF-8">
<title>SkillForge AI Tutor</title>

<link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Inter,sans-serif;
}

body{
background:linear-gradient(135deg,#c6c4ff,#98c5ff);
height:100vh;
display:flex;
align-items:center;
justify-content:center;
}

/* MAIN CONTAINER */

.container{
width:95%;
height:92vh;
background:#f6f7fb;
border-radius:28px;
display:flex;
overflow:hidden;
}

/* SIDEBAR */

.sidebar{
width:80px;
background:#fff;
display:flex;
flex-direction:column;
align-items:center;
padding-top:20px;
gap:30px;
}

.sidebar button{
width:45px;
height:45px;
border:none;
border-radius:12px;
background:#f0f2f8;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
}

.sidebar button i{
font-size:20px;
color:#444;
}

.sidebar button.active{
background:#111;
}

.sidebar button.active i{
color:white;
}

/* CHAT HISTORY */

.history{
width:230px;
background:white;
border-right:1px solid #eee;
padding:15px;
overflow-y:auto;
}

.history h3{
font-size:14px;
margin-bottom:15px;
color:#555;
}

.chat-item{
padding:10px;
border-radius:8px;
background:#f3f4ff;
margin-bottom:8px;
cursor:pointer;
font-size:13px;
}

.chat-item:hover{
background:#e5e7ff;
}

/* CONTENT */

.content{
flex:1;
display:flex;
flex-direction:column;
}

/* HEADER */

.chat-header{
padding:20px 30px;
border-bottom:1px solid #eee;
display:flex;
justify-content:space-between;
align-items:center;
background:white;
}

.chat-header h2{
font-weight:600;
display:flex;
align-items:center;
gap:8px;
}

.new-chat{
background:#6c7cff;
color:white;
border:none;
padding:8px 14px;
border-radius:8px;
cursor:pointer;
}

/* CHAT AREA */

.chat-area{
flex:1;
padding:30px;
overflow-y:auto;
display:flex;
flex-direction:column;
gap:15px;
}

/* MESSAGE */

.message{
max-width:65%;
padding:14px 18px;
border-radius:12px;
font-size:14px;
line-height:1.5;
}

.user{
background:#6c7cff;
color:white;
align-self:flex-end;
}

.ai{
background:white;
border:1px solid #e5e7ff;
align-self:flex-start;
}

/* PROMPTS */

.prompts{
display:flex;
gap:10px;
flex-wrap:wrap;
padding:0 30px 10px 30px;
}

.prompt{
background:#eef0ff;
padding:6px 12px;
border-radius:20px;
font-size:12px;
cursor:pointer;
}

.prompt:hover{
background:#dde0ff;
}

/* INPUT AREA */

.chat-input{
padding:20px;
border-top:1px solid #eee;
display:flex;
gap:10px;
background:white;
}

.chat-input input{
flex:1;
padding:12px;
border-radius:8px;
border:1px solid #ddd;
outline:none;
}

.chat-input button{
background:#6c7cff;
border:none;
color:white;
padding:12px 20px;
border-radius:8px;
cursor:pointer;
}

</style>

</head>

<body>

<div class="container">

<!-- MAIN SIDEBAR -->

<div class="sidebar">

<button onclick="location.href='dashboard.html'">
<i class="ri-home-4-line"></i>
</button>

<button onclick="location.href='courses.html'">
<i class="ri-book-open-line"></i>
</button>

<button onclick="location.href='adaptive-test.html'">
<i class="ri-brain-line"></i>
</button>

<button onclick="location.href='performance.html'">
<i class="ri-bar-chart-line"></i>
</button>

<button onclick="location.href='files.html'">
<i class="ri-file-text-line"></i>
</button>

<button onclick="location.href='certificates.html'">
<i class="ri-award-line"></i>
</button>

<button class="active">
<i class="ri-robot-line"></i>
</button>

<button onclick="location.href='settings.html'">
<i class="ri-settings-3-line"></i>
</button>

</div>

<!-- CHAT HISTORY PANEL -->

<div class="history">

<h3>Chat History</h3>

<div id="historyList"></div>

</div>

<!-- MAIN CHAT CONTENT -->

<div class="content">

<div class="chat-header">

<h2>
<i class="ri-robot-line"></i>
AI Tutor
</h2>

<button class="new-chat" onclick="startNewChat()">New Chat</button>

</div>

<div class="prompts">

<div class="prompt" onclick="usePrompt('What is machine learning?')">
What is machine learning?
</div>

<div class="prompt" onclick="usePrompt('Explain neural networks')">
Explain neural networks
</div>

<div class="prompt" onclick="usePrompt('What is deep learning?')">
What is deep learning?
</div>

<div class="prompt" onclick="usePrompt('How does supervised learning work?')">
Supervised learning
</div>

</div>

<div id="chatArea" class="chat-area"></div>

<div class="chat-input">

<input
type="text"
id="userInput"
placeholder="Ask your doubt..."

>

<button onclick="sendMessage()">Send</button>

</div>

</div>

</div>

<script>

const chatArea = document.getElementById("chatArea");
const input = document.getElementById("userInput");
const historyList = document.getElementById("historyList");

let chats = JSON.parse(localStorage.getItem("skillforgeChats")) || [];
let currentChat = null;

/* LOAD HISTORY */

function loadHistory(){

historyList.innerHTML="";

chats.forEach((chat,index)=>{

const div=document.createElement("div");
div.className="chat-item";
div.innerText=chat.title;

div.onclick=()=>{
currentChat=index;
chatArea.innerHTML=chat.messages;
};

historyList.appendChild(div);

});

}

/* NEW CHAT */

function startNewChat(){

currentChat = chats.length;

const chat = {
title:"New Chat "+(chats.length+1),
messages:""
};

chats.push(chat);

localStorage.setItem("skillforgeChats",JSON.stringify(chats));

loadHistory();

chatArea.innerHTML="";

}

/* SEND MESSAGE */

function sendMessage(){

const text = input.value.trim();
if(!text) return;

/* USER MESSAGE */

const userMsg = document.createElement("div");
userMsg.className="message user";
userMsg.innerText=text;

chatArea.appendChild(userMsg);

input.value="";

/* AI MESSAGE */

const aiMsg = document.createElement("div");
aiMsg.className="message ai";
aiMsg.innerText="AI is typing...";

chatArea.appendChild(aiMsg);

chatArea.scrollTop = chatArea.scrollHeight;

/* API CALL */

fetch("http://localhost:5000/api/ai-chat",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({message:text})
})
.then(res=>res.json())
.then(data=>{

aiMsg.innerText=data.reply;

saveChat();

chatArea.scrollTop=chatArea.scrollHeight;

})
.catch(()=>{
aiMsg.innerText="AI tutor unavailable";
});

}

/* SAVE CHAT */

function saveChat(){

if(currentChat===null) return;

chats[currentChat].messages = chatArea.innerHTML;

localStorage.setItem("skillforgeChats",JSON.stringify(chats));

}

/* PROMPT CLICK */

function usePrompt(text){
input.value=text;
input.focus();
}

/* ENTER SEND */

input.addEventListener("keypress",function(e){

if(e.key==="Enter"){
sendMessage();
}

});

/* INIT */

loadHistory();

</script>

</body>
</html>
